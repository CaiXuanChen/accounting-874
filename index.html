<style>

 #d8e2e6;color:var(--ink);border-radius:10px;padding:11px 13px;min-height:43px}.input{flex:1;min-width:210px}.select{max-width:100%}.btn{background:var(--accent);border:1px solid var(--accent);border-radius:10px;color:white;padding:9px 16px;font-weight:650;min-height:42px}.btn:hover{filter:brightness(.94)}.btn.alt{background:white;color:var(--ink);border-color:var(--line)}.btn.small{min-height:35px;padding:6px 10px;font-size:12px}.btn.danger{background:#fff5f4;color:var(--bad);border-color:#f2d8d6}.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(17px,3vw,32px);box-shadow:0 6px 24px rgba(17,45,54,.035)}.tag{display:inline-block;background:var(--accent2);color:var(--accent);font-size:12px;padding:4px 10px;border-radius:50px;font-weight:700}.qheader{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.qnum{font-size:15px;font-weight:780}.question{white-space:pre-wrap;font-weight:750;font-size:clamp(17px,2.1vw,22px);line-height:1.7;margin:24px 0}.choices{display:grid;gap:10px}.choice{text-align:left;background:white;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;gap:13px;align-items:flex-start;line-height:1.6}.choice .symbol{background:#f0f5f5;display:grid;place-items:center;flex:0 0 28px;height:28px;border-radius:9px;font-weight:800;color:#425d66}.choice:hover:not(:disabled){border-color:#9cc7c3;background:#f9fdfc}.choice.selected{border-color:var(--accent);background:#eef8f6}.choice.correct{border-color:var(--good);background:#effaf5}.choice.incorrect{border-color:var(--bad);background:#fff2f0}.choice:disabled{cursor:default}.note{background:#f5f8fa;border-left:4px solid var(--accent);padding:16px 18px;margin-top:22px;border-radius:5px 12px 12px 5px;white-space:pre-wrap}.note h3{margin:0 0 8px;font-size:15px}.note p{margin:7px 0;font-size:14px}.warn{background:#fff6e9;border:1px solid #edd3ae;color:#78511b;padding:12px;border-radius:10px;margin:12px 0;font-size:13px}.section-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:23px}.row{display:flex;gap:8px;flex-wrap:wrap}.hint{color:var(--muted);font-size:12px}.listview{margin-top:15px;display:grid;gap:10px}.listcard{background:white;border:1px solid var(--line);border-radius:13px;padding:13px 17px;display:flex;align-items:center;gap:14px;justify-content:space-between}.listcard:hover{border-color:#9fc7c6}.listcard .lc{font-weight:700;font-size:14px}.listcard p{margin:2px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:650px}.pager{display:flex;gap:8px;justify-content:center;margin:18px 0}.progress{height:7px;border-radius:30px;background:#deeaeb;overflow:hidden}.progress>span{display:block;height:100%;background:var(--accent);width:0}.kbd{font-size:11px;letter-spacing:.4px;color:#8ca4a8}.explain-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.info-card{padding:16px;border:1px solid var(--line);border-radius:14px;background:white}.info-card strong{font-size:13px}.info-card p{margin:6px 0;font-size:13px;color:var(--muted)}.mobile-top{display:none}.hide{display:none!important}a{color:var(--accent)}@media(max-width:850px){.app{display:block}.side{height:auto;position:static;padding:12px 15px}.side .brand{font-size:18px}.side .cap,.side .navs{display:none}.mobile-top{display:flex;gap:8px;flex-wrap:wrap}.main{padding:19px 15px 45px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:14px}.stat .num{font-size:23px}.explain-grid{grid-template-columns:1fr}.listcard p{max-width:65vw}}@media print{.side,.toolbar,.section-foot,.mobile-top{display:none!important}.app{display:block}.main{padding:0}.panel{box-shadow:none}.choice{break-inside:avoid}}

<script>const BANK=[{"id":"1-1","unit":1,"num":1,"q":"下列敘述何者錯誤？","choices":["結帳工作底稿之欄次多寡，可依實際需要而增減","銷貨運費為銷貨收入之減項","進貨運費為銷貨成本之加項","調整後試算表之保留盈餘，未含本期損益 。"],"ans":[1],"topic":"進貨、折扣與成本","explain":"銷貨運費通常屬銷售費用，不是銷貨收入減項；進貨運費則通常計入存貨取得成本，影響銷貨成本。調整後試算表中的保留盈餘在結帳前尚未包含本期損益。","detail":true},{"id":"1-2","unit":1,"num":2,"q":"會計結帳後","choices":["所有帳戶餘額皆為零","收益、費損及權益帳戶餘額為零","資產、負債及權益帳戶皆為零","收益、費損及本期損益帳戶餘額為零 。"],"ans":[3],"topic":"權益會計","explain":"結帳時要把收入、費用與本期損益等虛帳戶結清；資產、負債及永久性的權益帳戶仍保有餘額，帶入下一期。","detail":true},{"id":"1-3","unit":1,"num":3,"q":"甲公司本年度銷貨毛利$138,000，銷售費用$42,000，管理費用$28,000，營業外收益$8,000，則下列計算何者正確？","choices":["營業利益$68,000","營業利益$110,000","銷貨淨額$208,000","稅前淨利$60,000 。"],"ans":[0],"topic":"銷貨及收入認列","explain":"營業利益＝銷貨毛利－銷售費用－管理費用＝138,000－42,000－28,000＝68,000；營業外收益不包含在營業利益內。","detail":true},{"id":"1-4","unit":1,"num":4,"q":"會計上之所以有應計事項、預收預付事項之存在，乃基於","choices":["企業個體","繼續經營","會計期間","貨幣評價 。"],"ans":[2],"topic":"會計基本假設","explain":"會計期間假設要求將持續經營企業劃分期間，因此需要透過應計、預收及預付的調整，適當歸屬當期收入與費用。","detail":true},{"id":"1-5","unit":1,"num":5,"q":"大同公司期初資產總額$560,000、負債總額$260,000、本期銷貨淨額$1,100,000、銷貨成本$700,000、期末存貨$100,000、營業費用$240,000、利息支出$60,000，則期末結帳後的權益為若干？","choices":["$100,000","$200,000","$300,000","$400,000 。"],"ans":[3],"topic":"存貨衡量與銷貨成本","explain":"期初權益＝560,000－260,000＝300,000；當期淨利＝1,100,000－700,000－240,000－60,000＝100,000；無其他權益變動假設下期末權益400,000。","detail":true},{"id":"1-6","unit":1,"num":6,"q":"大忠公司上年底漏未調整應付薪資$17,500，本年底用品盤存$7,500 又誤為費用，此兩項錯誤將導致？","choices":["本年度淨利低估$25,000；本年底保留盈餘低估$7,500","上年度淨利及上年底保留盈餘均各低估$17,500","上年度淨利高估$17,500；本年度淨利低估$7,500","本年度淨利及本年底保留盈餘均各低估$7,500 。"],"ans":[0],"topic":"保留盈餘與權益","explain":"本題要求辨認正確的敘述，依題庫選取：①本年度淨利低估$25,000；本年底保留盈餘低估$7,500。採權責發生制，應將收入及費用歸屬正確期間；檢查期初與期末預付、應計餘額的增減。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"1-7","unit":1,"num":7,"q":"現銷交易誤記為借：現金、貸：進貨，則此項錯誤將使當年度？","choices":["淨利高估","銷貨成本高估","淨利或淨損不受影響","銷貨毛利低估 。"],"ans":[2],"topic":"進貨、折扣與成本","explain":"本題要求辨認正確的敘述，依題庫選取：③淨利或淨損不受影響。可先列存貨流轉式：期初存貨＋本期進貨－銷貨成本＝期末存貨，並留意退貨及運費。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"1-8","unit":1,"num":8,"q":"下列有關工作底稿之敘述，何者正確？","choices":["不編工作底稿則會計程序無法完成","因工作底稿為非正式報表，故可選擇任何格式，甚或不編","工作底稿為向股東及債權人公佈之報表","編妥工作底稿後可免在日記簿作調整分錄 。"],"ans":[1],"topic":"工作底稿與結帳","explain":"本題要求辨認正確的敘述，依題庫選取：②因工作底稿為非正式報表，故可選擇任何格式，甚或不編。本題考查「工作底稿與結帳」。解題時先辨認題目所問是正確敘述、錯誤敘述或數值計算，再逐項檢查條件與分類。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"1-9","unit":1,"num":9,"q":"丙店原總額式試算表合計數為 $900,000，後發現一筆利息費用 $10,000 誤記為佣金支出，作更正分錄後，則總額式試算表之合計數？","choices":["$920,000","$910,000","$900,000","$890,000 。"],"ans":[1],"topic":"試算表及錯誤更正","explain":"本題要求辨認正確的敘述，依題庫選取：②$910,000。試算表的核心是檢查借貸金額是否相等；借貸平衡不保證分類、漏記或會計處理皆正確。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"1-10","unit":1,"num":10,"q":"下列哪項錯誤，會影響試算表之平衡？","choices":["整筆交易重覆記帳","誤用會計項目","某筆交易借方金額漏未過帳","誤用會計原則 。"],"ans":[2],"topic":"試算表及錯誤更正","explain":"本題要求辨認正確的敘述，依題庫選取：③某筆交易借方金額漏未過帳。試算表的核心是檢查借貸金額是否相等；借貸平衡不保證分類、漏記或會計處理皆正確。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"1-11","unit":1,"num":11,"q":"明道商店本年初：資產總額$350,000、負債總額$180,000，至年底時：資產總額$420,000、負債總額$200,000，業主曾於年中增資$30,000，則本年度淨利為？","choices":["$10,000","$20,000","$50,000","$60,000 。"],"ans":[1],"topic":"會計基本概念及會計處理程序","explain":"本題要求辨認正確的敘述，依題庫選取：②$20,000。本題考查「會計基本概念及會計處理程序」。解題時先辨認題目所問是正確敘述、錯誤敘述或數值計算，再逐項檢查條件與分類。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"1-12","unit":1,"num":12,"q":"下列敘述何者錯誤？","choices":["企業財務報表上所使用之會計項目名稱及金額，均應與其分類帳上所使用之會計項目名稱及金額完全一致","進項稅額、公司債折價、應付票據折價，均屬借餘會計項目","因為有權責基礎，才會有應計、預計與估計項目之調整","所得稅是綜合損益表內的一項單獨費用，而非盈餘分配項目 。"],"ans":[0],"topic":"公司債會計","explain":"本題要求辨認錯誤的敘述，依題庫選取：①企業財務報表上所使用之會計項目名稱及金額，均應與其分類帳上所使用之會計項目名稱及金額完全一致。先判斷投資人或發行人的立場，分清利息現金支付、有效利息及折溢價攤銷。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"1-13","unit":1,"num":13,"q":"賒購商品定價$10,000，商業折扣 20%，付款條件 3/10、2/20、n/30，如該店在第 9 天付現$2,910，第 18 天付現$3,920，則該店應付帳款餘額為？","choices":["$6,830","$3,170","$3,000","$1,000 。"],"ans":[3],"topic":"負債與應付項目","explain":"本題要求辨認正確的敘述，依題庫選取：④$1,000 。。用作業流程判斷文件用途：採購核准→收貨驗收→供應商發票→付款；銷貨則接單→授信→出貨→請款→收款。 請對照其餘選項，特 in":"本題要求辨認正確的敘述，依題庫選取：①當公司財務槓桿指數大於1，代表適合舉債經營。本題考查「財務比率分析」。解題時先辨認題目所問是正確敘述、錯誤敘述或數值計算，再逐項檢查條件與分類。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"4-92","unit":4,"num":92,"q":"三越公司目前流動比率為 2：1，速動比率大於 1，試判斷下列交易對於流動比率、速動比率及營運資金之影響，何項敘述正確？","choices":["股東現金增資$200,000，速動比率會減少","以現金$40,000 償還應付帳款，會增加營運資金","顧客破產，所積欠帳款$100,000 確定無法收回，流動比率不變","宣告現金股利$15,000，預計 1 個月後發放，流動比率會增加 。"],"ans":[2],"topic":"財務比率分析","explain":"本題要求辨認正確的敘述，依題庫選取：③顧客破產，所積欠帳款$100,000 確定無法收回，流動比率不變。流動比率＝流動資產／流動負債；速動比率須排除存貨、預付款等非速動資產；營運資金＝流動資產－流動負債。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"4-93","unit":4,"num":93,"q":"若流動比率大於 1，速動比率小於 1，下敘述何者正確？","choices":["向銀行借得短期信用借款會使流動比率增加","支付已宣告之現金股利會使速動比率減少","支付已宣告之現金股利會使流動比率減少","應收帳款收現會使營運資金增加 。"],"ans":[1],"topic":"應收款項與信用損失","explain":"本題要求辨認正確的敘述，依題庫選取：②支付已宣告之現金股利會使速動比率減少。流動比率＝流動資產／流動負債；速動比率須排除存貨、預付款等非速動資產；營運資金＝流動資產－流動負債。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"4-94","unit":4,"num":94,"q":"大甲公司 102 年 1 月 1 日營運資金為$540,000，102 年度僅發生兩筆交易，即賒購商品$600,000，並將該商品按成本加計 30%之利潤後為賒銷收入，計入上述交易後，其流動比率為 2，下列大甲公司 102 年之財務報表相關資訊何者正確？","choices":["102 年 1 月 1 日流動負債之金額為 $120,000","102 年 12 月 31 日流動負債之金額為$720,000","102 年 1 月 1 日流動資產之金額為$540,000","102 年 12 月 31 日流動資產之金額為 $1,440,000 。"],"ans":[0,1,3],"topic":"財務比率分析","explain":"賒購60萬不改變營運資金，按成本加價30%賒銷增加18萬；期末營運資金72萬、流動比率2，故CL72萬、CA144萬；期初CL12萬、期初CA66萬；①②④正確。","detail":true},{"id":"4-95","unit":4,"num":95,"q":"假設海洋公司 102 年度之銷貨額為$8,000,000，本期淨利為$3,200,000 ，平均投入資產$16,000,000，則下列關於該公司 102 年度之敘述何者正確？","choices":["資產報酬率為 0.2","毛利率為 0.4","資產週轉率為 0.25","淨利率為 0.4 。"],"ans":[0,3],"topic":"銷貨及收入認列","explain":"本題要求辨認正確的敘述，依題庫選取：①資產報酬率為 0.2；④淨利率為 0.4 。。本題考查「銷貨及收入認列」。解題時先辨認題目所問是正確敘述、錯誤敘述或數值計算，再逐項檢查條件與分類。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"4-96","unit":4,"num":96,"q":"假設成功公司 102 年 12 月 31 日之現金為$40,000、指定為透過損益按公允價值衡量之金融資產-流動為$50,000、應收帳款為$95,000、應收票據為$15,000、存貨為$40,000、預付費用為$60,000、短期借款$100,000、應付帳款為$110,000、應付票據為$70,000 及其他流動負債為$120,000，則下列關於該公司 102 年 12 月 31 日之敘述何者正確？","choices":["流動比率為 0.60","流 前提。","detail":false,"flag":"選項③寫「所得稅費用」，準則需揭露的是所得稅相關現金流量。"},{"id":"4-141","unit":4,"num":141,"q":"常見之約當現金通常包括","choices":["3 個月內到期之商業本票","郵票","銀行承兌匯票","預支旅費 。"],"ans":[0,2],"topic":"現金流量表之編製與財務報表分析","explain":"本題要求辨認正確的敘述，依題庫選取：①3 個月內到期之商業本票；③銀行承兌匯票。先判斷有無實際現金收付，再分類營業、投資或籌資活動；間接法須調整非現金損益及營運資金變動。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"5-1","unit":5,"num":1,"q":"我們要訂購高鐵或台鐵車票劃位時，該電腦系統係採用","choices":["批次處理","即時連線處理","即時批次處理","離線處理 。"],"ans":[1],"topic":"電腦化會計處理","explain":"訂車票需要即時確認座位並更新資料，避免同一座位重複出售，故採即時連線處理；批次處理則是累積交易後集中執行。","detail":true},{"id":"5-2","unit":5,"num":2,"q":"原本以人工處理會計業務，在年度中欲轉換為電腦化處理，需要哪種資訊？","choices":["調整事項","資產負債表","試算表","綜合損益表 。"],"ans":[2],"topic":"試算表及錯誤更正","explain":"人工轉電腦化時，需要各總帳科目完整借貸餘額，因此用轉換日試算表導入並驗證平衡；實務還須另導入客戶、供應商與存貨明細。","detail":true},{"id":"5-3","unit":5,"num":3,"q":"各項報表格式可定義的列印項目中，最不可能有","choices":["報表表頭及頁碼","列印人員","系統設計人員姓名","列印日期 。"],"ans":[2],"topic":"資訊系統及內部控制","explain":"本題要求辨認正確的敘述，依題庫選取：③系統設計人員姓名。本題考查「資訊系統及內部控制」。解題時先辨認題目所問是正確敘述、錯誤敘述或數值計算，再逐項檢查條件與分類。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"5-4","unit":5,"num":4,"q":"下列何者並非銷售時點(POS)系統的主要效益？","choices":["瞭解消費者購買行為","達到最適存貨組合與管理","防止商品遭偷竊機會","可彈性增加兼職人員的僱用 。"],"ans":[2],"topic":"存貨衡量與銷貨成本","explain":"POS的核心效益為銷售資料收集、客戶行為分析、庫存與排班管理。防盜須靠盤點、防竊設備與內控，並非POS自身主要效益。","detail":true},{"id":"5-5","unit":5,"num":5,"q":"賣方完成出貨程序後，買方會取得下列哪些文件？","choices":["報價單、發票、收款通知單","報價單、銷貨單、發票、裝箱單","訂單、驗收單、貸項通知單","借項通知單、銷貨單、發票 。"],"ans":[1],"topic":"銷貨及收入認列","explain":"本題要求辨認正確的敘述，依題庫選取：②報價單、銷貨單、發票、裝箱單。用作業流程判斷文件用途：採購核准→收貨驗收→供應商發票→付款；銷貨則接單→授信→出貨→請款→收款。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"5-6","unit":5,"num":6,"q":"下列關於應收帳款檔的敘述何者正確？","choices":["相當於人工帳務處理時的應收帳款總分類帳","其主要內容包括付款通知單編號及支票號碼","相當於人工帳務處理時的應付帳款明細帳","其主要內容為應收帳款各客戶交易、償還金額及欠款餘額 。"],"ans":[3],"topic":"應收款項與信用損失","explain":"應收帳款檔依客戶管理銷貨、已收款及未收餘額，功能近似應收帳款明細帳，非應付帳款明細帳或單一總分類帳控制科目。","detail":true},{"id":"5-7","unit":5,"num":7,"q":"下列關於應付帳款檔的敘述何者正確？","choices":["相當於人工帳務處理時的應付帳款總分類帳","其主要內容包括收款通知單編號及支票號碼","相當於人工帳務處理時的應付帳款明細帳","其主要內容包括存貨的交易數量及採購金額 。"],"ans":[2],"topic":"存貨衡量與銷貨成本","explain":"應付帳款檔依供應商追蹤應付發票、付款、欠款餘額，功能近似應付帳款明細帳。","detail":true},{"id":"5-8","unit":5,"num":8,"q":"下列有關存貨檔的敘述何者正確？","choices":["相當於人工帳務處理時的存貨總分類帳","其主要內容包括驗收單","相當於人工帳務處理時的存貨明細帳","其主要內容包括出貨單 。"],"ans":[2],"topic":"存貨衡量與銷貨成本","explain":"存貨檔保存各品項進銷存數量與成本，功能近似存貨明細帳；驗收單、出貨單則是交易憑證而非主檔。","detail":true},{"id":"5-9","unit":5,"num":9,"q":"下列何者非存貨循環的目的？","choices":["維持適當的存貨數量，以符合客戶的需求","正確表達庫存貨品的價值","貨物既出，概不退換，以省卻退換貨的麻煩","維護存貨的安全，以防止盜竊或其他損失 。"],"ans":[2],"topic":"存貨衡量與銷貨成本","explain":"本題要求辨認錯誤的敘述，依題庫選取：③貨物既出，概不退換，以省卻退換貨的麻煩。可先列存貨流轉式：期初存貨＋本期進貨－銷貨成本＝期末存貨，並留意退貨及運費。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"5-10","unit":5,"num":10,"q":"在銷貨收入循環中，下列何種單據可代表商品退回的憑證？","choices":["銷貨單","驗收單","進貨單","貸項通知單 。"],"ans":[1],"topic":"進貨、折扣與成本","explain":"題庫認定驗收單證明退回商品已實際收到；貸項通知單則是調整客戶應收帳款的文件。勿混淆實物驗收與帳款減少。","detail":true},{"id":"5-11","unit":5,"num":11,"q":"在收入循環中，銷貨單若開列多聯無法取代下列何種單據？","choices":["訂單","揀貨單","接訂通知單","出貨單 。"],"ans":[0],"topic":"銷貨及收入認列","explain":"本題要求辨認正確的敘述，依題庫選取：①訂單。本題考查「銷貨及收入認列」。解題時先辨認題目所問是正確敘述、錯誤敘述或數值計算，再逐項檢查條件與分類。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"5-12","unit":5,"num":12,"q":"如何將新舊系統轉換時的風險降至最低？","choices":["實施嚴格的內部控管措施","實施新舊系統並行作業一段時間","將新系統開發的很完善","儘速實施新系統 。"],"ans":[1],"topic":"資訊系統及內部控制","explain":"平行轉換讓新舊系統同時處理交易，可比對結果並保留舊系統備援，降低立即切換的營運風險，但成本較高。","detail":true},{"id":"5-13","unit":5,"num":13,"q":"下列何者是系統生命週期存續期間需花費最多金額？","choices":["系統分析","系統規劃","系統建置及轉換","系統營運及維護 。"],"ans":[3],"topic":"資訊系統及內部控制","explain":"本題要求辨認正確的敘述，依題庫選取：④系統營運及維護 。。本題考查「資訊系統及內部控制」。解題時先辨認題目所問是正確敘述、錯誤敘述或數值計算，再逐項檢查條件與分類。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"5-14","unit":5,"num":14,"q":"以下哪個表單不屬採購支出循環？","choices":["入庫單","供應商發票","驗收單","出貨單 。"],"ans":[3],"topic":"會計資訊與進銷存相關資訊處理作業","explain":"本題要求辨認正確的敘述，依題庫選取：④出貨單 。。用作業流程判斷文件用途：採購核准→收貨驗收→供應商發票→付款；銷貨則接單→授信→出貨→請款→收款。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"5-15","unit":5,"num":15,"q":"下列哪一項不是採購循環的風險？","choices":["客戶信用不佳","採購存貨 述，依題庫選取：①銷貨發票、應付票據及傳票等憑證號碼必會連續編號；④電腦化會計處理程序包括帳務處理程序和資料檔設立 。。本題考查「銷貨及收入認列」。解題時先辨認題目所問是正確敘述、錯誤敘述或數值計算，再逐項檢查條件與分類。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"5-44","unit":5,"num":44,"q":"關於企業之會計資訊系統有許多共通性，是基於","choices":["主管機關類似","處理交易的流程類似","財務報表的架構類似","組織規模類似 。"],"ans":[1,2],"topic":"資訊系統及內部控制","explain":"本題要求辨認正確的敘述，依題庫選取：②處理交易的流程類似；③財務報表的架構類似。本題考查「資訊系統及內部控制」。解題時先辨認題目所問是正確敘述、錯誤敘述或數值計算，再逐項檢查條件與分類。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"5-45","unit":5,"num":45,"q":"會計資訊系統可增加企業之價值，下列何者是正確的？","choices":["改進服務的品質","減少各項投資的金額","增進效率","改進管理決策的過程 。"],"ans":[0,2,3],"topic":"資訊系統及內部控制","explain":"本題要求辨認正確的敘述，依題庫選取：①改進服務的品質；③增進效率；④改進管理決策的過程 。。本題考查「資訊系統及內部控制」。解題時先辨認題目所問是正確敘述、錯誤敘述或數值計算，再逐項檢查條件與分類。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"5-46","unit":5,"num":46,"q":"下列哪些作業不能由會計人員操作？","choices":["庫存管理作業","應收、應付帳款作業","營業稅申報作業","票據資金管理作業 。"],"ans":[0,3],"topic":"票據會計","explain":"帳務記錄不宜和庫存實體保管、票據資金保管集中於同一人；應收應付帳務與營業稅申報則可由合格會計人員處理。這是職能分工原則，不代表完全不能讀取相關系統資料。","detail":true},{"id":"6-1","unit":6,"num":1,"q":"下列何者非會計人員之專業道德？","choices":["熟練記帳技巧","超然獨立，客觀公正","遵守有關法令","不編造虛飾之財務報表 。"],"ans":[0],"topic":"相關法令之規定","explain":"本題要求辨認錯誤的敘述，依題庫選取：①熟練記帳技巧。本題考查「相關法令之規定」。解題時先辨認題目所問是正確敘述、錯誤敘述或數值計算，再逐項檢查條件與分類。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"6-2","unit":6,"num":2,"q":"依商業會計法規定商業支出超過一定金額以上者，應使用匯票、本票、支票、劃撥或其他經主管機關核定之支付工具或方法，並載明受款人，試問現行主管機關規定之一定金額為若干？","choices":["$50,000","$100,000","$500,000","$1,000,000 。"],"ans":[3],"topic":"商業會計法規","explain":"《商業會計法》第9條及主管機關規定，商業支出達新臺幣100萬元須依規定採用可追蹤支付工具或方式並載明受款人。","detail":true},{"id":"6-3","unit":6,"num":3,"q":"有限公司對主辦會計之任免，須有下列何者過半數同意，始符規定？","choices":["常務董事","董事","股東","監察人 。"],"ans":[2],"topic":"相關法令之規定","explain":"《商業會計法》第5條：有限公司主辦會計人員任免須經全體股東過半數同意；與股份有限公司董事會決議門檻不同。","detail":true},{"id":"6-4","unit":6,"num":4,"q":"會計人員離職或變更職務時，應於若干日內辦理交代？","choices":["3 日","5 日","7日","10 日 。"],"ans":[1],"topic":"相關法令之規定","explain":"《商業會計法》第5條：會計人員離職或變更職務，應於五日內辦理交代。","detail":true},{"id":"6-5","unit":6,"num":5,"q":"下列何者非屬財務報表？","choices":["現金流量表","權益變動表","試算表","綜合損益表 。"],"ans":[2],"topic":"現金流量表","explain":"《商業會計法》第28條所列財務報表包括資產負債表、綜合損益表、現金流量表及權益變動表等；試算表是會計工作表，非正式財務報表。","detail":true},{"id":"6-6","unit":6,"num":6,"q":"商業應設置帳簿目錄，記明其設置使用之帳簿名稱、性質、啟用停用日期，並由下列何人簽字？","choices":["商業負責人及經辦會計人員","經理人與主辦會計人員","主辦會計人員與經辦會計人員","經理人與經辦會計人員 。"],"ans":[0],"topic":"相關法令之規定","explain":"《商業會計法》第25條：帳簿目錄由商業負責人與經辦會計人員簽章；不同於決算報表依第66條的簽章組合。","detail":true},{"id":"6-7","unit":6,"num":7,"q":"商業負責人、主辦及經辦會計人員有下列哪一情形者應處五年以下有期徒刑、拘役或併科新台幣六十萬元以下罰金？","choices":["不設置應備之帳簿目錄者","不按時記帳者","故意遺漏會計事項不為登錄，致使財務報表發生不實之結果","不造具財務報表者 。"],"ans":[2],"topic":"相關法令之規定","explain":"《商業會計法》第71條：故意遺漏會計事項且致財報不實，符合犯罪要件時可處五年以下有期徒刑、拘役或科或併科60萬元以下罰金。","detail":true},{"id":"6-8","unit":6,"num":8,"q":"商業負責人、經理人、主辦及經辦會計人員有下列哪一情形，應處新台幣三十萬元以下罰鍰？","choices":["不按時記帳","未依規定裝訂或保管會計憑證","利用不正當方法，致使會計事項或財務報表發生不實之結果者","未如期辦理決算者 。"],"ans":[3],"topic":"會計憑證","explain":"未如期辦理決算涉及《商業會計法》第76條，行政罰鍰6萬～30萬元；未按時記帳屬其他處罰條文，不可混淆。","detail":true},{"id":"6-9","unit":6,"num":9,"q":"決算報表應由下列哪一組人員簽名或蓋章負責 ？","choices":["會計師、代表商業之負責人及主辦會計人員","代表商業之負責人、經理人及主辦會計人員","代表商業之負責人、主辦及經辦會計人員","代表商業之負責人、經理人及經辦會計人員 。"],"ans":[1],"topic":"相關法令之規定","explain":"《商業會計法》第66條：決算報表須由代表商業之負責人、經理人及主辦會計人員簽章。","detail":true},{"id":"6-10","unit":6,"num":10,"q":"假設營利事業所得稅規定課稅所得在 $120,000 以下者，免徵營利事業所得稅，在$120,000 以上者稅率為 17%，又依促進民間參與公共建設法規定於購置防治污染設備，可依規定計算抵減當年度應納營利事業所得稅額百分之五十為限，設甲公司 101 年申報課稅所得額為$1,000,000，未抵減之扣繳稅額為$50,000 及當期未扣抵之投資抵減稅額$200,000，則甲公司尚應補繳之稅額為","choices":["$35,000","$75,000","$120,000","$170,000 。"],"ans":[0],"topic":"所得稅會計","explain":"本題依歷史假設：原應納稅額＝1,000,000×17%＝170,000；投資抵減以50%為上限＝85,000，再扣已扣繳50,000，補繳35,000。題設稅制不可直接當作2026現行規定。","detail":true},{"id":"6-11","unit":6,"num":11,"q":"記帳憑證保管期限屆滿，應經下列何人核准始得銷毀？","choices":["主辦會計人員","經辦會計人員","經理人","代表商業之負責人 。"],"ans":[3],"topic":"會計憑證","explain":"本題要求辨認正確的敘述，依題庫選取：④代表商業之負責人 。。本題考查「會計憑證」。解題時先辨認題目所問是正確敘述、錯誤敘述或數值計算，再逐項檢查條件與分類。 請對照其餘選項，特別注意題幹限定的時點、金額及會計處理前提。","detail":false},{"id":"6-12","unit":6,"num":12,"q":"毀損會計帳簿頁數，或毀滅審計軌跡應處","choice function buildnav(){let s=UNITS.map((u,i)=>{let count=BANK.filter(q=>q.unit===i+1).length;return `<button class="nav" onclick="go('practice',${i+1})" data-unit="${i+1}">${String(i+1).padStart(2,'0')}　${escapeHTML(u)} <b>${count}</b></button>`}).join('');$('#unitnav').innerHTML=s;$('#wrongNav').textContent=stats().wrong;$('#favNav').textContent=BANK.filter(q=>rec(q).fav).length;document.querySelectorAll('.nav[data-route]').forEach(n=>n.classList.toggle('active',n.dataset.route===state.route));}
function go(route,unit){state.route=route;if(unit!==undefined){state.unit=unit;state.idx=0;state.search='';state.filter='all';}state.page=0;state.selection=[];state.revealed=false;render();window.scrollTo(0,0)}
function filterQuestions(){let a=BANK.filter(q=>(!state.unit||q.unit===state.unit)&&(!state.search||[q.q,...q.choices,q.topic,q.id].join(' ').toLowerCase().includes(state.search.toLowerCase())));if(state.route==='mistakes'||state.filter==='wrong')a=a.filter(q=>rec(q).wrong);if(state.route==='favorites'||state.filter==='fav')a=a.filter(q=>rec(q).fav);if(state.filter==='new')a=a.filter(q=>!rec(q).attempts);if(state.filter==='detailed')a=a.filter(q=>q.detail);return a}
function shell(title,subtitle){return `<div class="eyebrow">ACCOUNTING · STUDY SPACE</div><h1 class="headline">${title}</h1><p class="sub">${subtitle}</p>`}
function dashboard(){let st=stats();let html=shell('讀得懂，也答得對。','874 題原始題庫 × 作答紀錄 × 我的解析。你的進度會儲存在目前使用的瀏覽器。')+`<div class="stats"><div class="stat"><div class="num">874</div><div class="lab">總題數</div></div><div class="stat"><div class="num">${st.done}</div><div class="lab">已練習</div></div><div class="stat"><div class="num">${st.rate}%</div><div class="lab">目前答對率（以每題最近結果計）</div></div><div class="stat"><div class="num">${st.wrong}</div><div class="lab">待複習錯題</div></div></div><div class="panel"><div class="qheader"><h2 style="margin:0">六大單元</h2><button class="btn" onclick="go('practice')">開始練習 ↗</button></div><div class="listview">`;
UNITS.forEach((name,i)=>{let n=i+1,a=BANK.filter(q=>q.unit===n),done=stats(a).done,p=Math.round(done/a.length*100);html+=`<div class="listcard" style="cursor:pointer" onclick="go('practice',${n})"><div style="flex:1"><div class="lc">${String(n).padStart(2,'0')}　${escapeHTML(name)}</div><p>${done} / ${a.length} 題已練習</p><div class="progress" style="margin-top:9px"><span style="width:${p}%"></span></div></div><span class="tag">${p}%</span></div>`});
html+=`</div></div><div class="explain-grid"><div class="info-card"><strong>✦ 快速測驗</strong><p>先作答，再顯示解答與解析；可逐題複習，也可以只練錯題。</p><button class="btn small alt" onclick="randomQuiz()">隨機抽題</button></div><div class="info-card"><strong>✦ 解析與題庫疑義</strong><p>每題提供以題意、答案及考點整理的解析；重點計算題附完整步驟，遇有可疑答案則加註警示。</p><button class="btn small alt" onclick="go('about')">了解資料來源</button></div></div>`;return html}
function controls(){return `<div class="toolbar"><input class="input" placeholder="搜尋題目、選項、關鍵字或題號（如 4-65）" value="${escapeHTML(state.search)}" oninput="setSearch(this.value)"><select class="select" onchange="changeUnit(this.value)"><option value="0">所有工作項目</option>${UNITS.map((u,i)=>`<option value="${i+1}" ${state.unit===i+1?'selected':''}>${i+1}｜${escapeHTML(u)}</option>`).join('')}</select><select class="select" onchange="changeFilter(this.value)"><option value="all" ${state.filter==='all'?'selected':''}>全部題目</option><option value="new" ${state.filter==='new'?'selected':''}>尚未練習</option><option value="wrong" ${state.filter==='wrong'?'selected':''}>只看錯題</option><option value="fav" ${state.filter==='fav'?'selected':''}>只看收藏</option><option value="detailed" ${state.filter==='detailed'?'selected':''}>完整解析精選</option></select><button class="btn alt" onclick="randomQuiz()">隨機一題</button></div>`}
function setSearch(s){state.search=s;state.idx=0;state.page=0;state.selection=[];state.revealed=false;render(false)}function changeUnit(v){state.unit=Number(v);state.idx=0;state.page=0;state.selection=[];state.revealed=false;render()}function changeFilter(v){state.filter=v;state.idx=0;state.page=0;state.selection=[];state.revealed=false;render()}
function renderPractice(){let list=filterQuestions(),title=state.route==='mistakes'?'錯題複習':state.route==='favorites'?'收藏題庫':'逐題練習';let x=shell(title,`目前篩選 ${list.length} 題。單選點一下作答，複選題可勾選多個選項後送出。`)+controls();if(!list.length)return x+`<div class="panel"><h3>目前沒有符合條件的題目</h3><p class="hint">可以取消篩選或選其他單元繼續學習。</p><button class="btn alt" onclick="resetFilter()">清除篩選</button></div>`;
state.idx=Math.max(0,Math.min(state.idx,list.length-1));let q=list[state.idx],rr=rec(q),multi=q.ans.length>1,letters=['①','②','③','④'];x+=`<div class="panel"><div class="qheader"><div><span class="tag">${multi?'複選題':'單選題'}</span> <span class="tag">${escapeHTML(q.topic)}</span></div><button class="btn small alt" onclick="toggleFav('${q.id}')">${rr.fav?'★ 已收藏':'☆ 收藏題目'}</button></div><p class="hint" style="margin-top:15px">工作項目 ${String(q.unit).padStart(2,'0')} · 第 ${q.num} 題　｜　篩選中的第 ${state.idx+1} / ${list.length} 題　｜　${q.detail?'★ 完整重點解析':'逐題考點解析'}</p><div class="progress"><span style="width:${(state.idx+1)/list.length*100}%"></span></div><div class="question">${escapeHTML(q.q)}</div><div class="choices">`;
q.choices.forEach((c,i)=>{let chosen=state.selection.includes(i),cl=state.revealed?(q.ans.includes(i)?'correct':chosen?'incorrect':''):chosen?'selected':'';x+=`<button class="choice ${cl}" onclick="choose(${i})" ${state.revealed?'disabled':''}><span class="symbol">${letters[i]}</span><span>${escapeHTML(c)}</span></button>`});x+='</div>';
if(state.revealed){let ok=q.ans.every(a=>state.selection.includes(a))&&state.selection.every(a=>q.ans.includes(a));x+=`<div class="note"><h3 style="color:${ok?'var(--good)':'var(--bad)'}">${ok?'✓ 回答正確':'✕ 需要複習'}　·　題庫答案 ${q.ans.map(a=>letters[a]).join('、')}</h3><p style="font-weight:700">我的解析</p><p>${escapeHTML(q.explain)}</p>${!q.detail?'<p class="hint">這題目前提供「題意與考點解析」；不是逐選項完整推導。可收藏加入重點複習。</p>':''}</div>`;if(q.flag)x+=`<div class="warn"><strong>題庫疑義：</strong>${escapeHTML(q.flag)}</div>`}
else if(rr.attempts)x+=`<p class="hint" style="margin-top:14px">這題曾練習 ${rr.attempts} 次，最近一次${rr.correct?'答對':'答錯'}。</p>`;
x+=`<div class="section-foot"><div class="row"><button class="btn alt" onclick="step(-1)" ${state.idx===0?'disabled':''}>← 上一題</button><button class="btn alt" onclick="step(1)" ${state.idx===list.length-1?'disabled':''}>下一題 →</button></div><div class="row">${!state.revealed?`<button class="btn" onclick="submitAnswer()" ${!state.selection.length?'disabled':''}>確認答案與查看解析</button><button class="btn alt" onclick="revealOnly()">直接看解析</button>`:`<button class="btn" onclick="step(1)" ${state.idx===list.length-1?'disabled':''}>繼續練習 →</button>`}</div></div><p class="kbd" style="margin-top:15px">快捷鍵：1–4 選項 · Enter 提交 · ← → 換題</p></div>`;
x+=`<div style="margin-top:20px;display:flex;justify-content:space-between;align-items:center"><strong>題目清單</strong><span class="hint">最多顯示當頁20題</span></div><div class="listview">`;
let start=state.page*20;if(state.idx<start||state.idx>=start+20){state.page=Math.floor(state.idx/20);start=state.page*20}list.slice(start,start+20).forEach((y,j)=>{let r=rec(y);x+=`<div class="listcard" style="cursor:pointer" onclick="jump(${start+j})"><div style="min-width:0"><div class="lc">${y.unit}-${y.num}　${escapeHTML(y.topic)}</div><p>${escapeHTML(y.q)}</p></div><span class="tag">${r.attempts?(r.correct?'✓':'需複習'):'未練習'}</span></div>`});x+=`</div><div class="pager"><button class="btn small alt" onclick="page(-1)" ${state.page===0?'disabled':''}>上一頁</button><span class="hint" style="padding:5px">${state.page+1} / ${Math.ceil(list.length/20)}</span><button class="btn small alt" onclick="page(1)" ${state.page>=Math.ceil(list.length/20)-1?'disabled':''}>下一頁</button></div>`;return x}
function choose(i){if(state.revealed)return;let q=filterQuestions()[state.idx];state.selection=q.ans.length===1?[i]:state.selection.includes(i)?state.selection.filter(a=>a!==i):[...state.selection,i];render(false)}function submitAnswer(){let q=filterQuestions()[state.idx];if(!q||!state.selection.length)return;let ok=q.ans.length===state.selection.length&&q.ans.every(a=>state.selection.includes(a));let r=rec(q);saved[q.id]={...r,attempts:(r.attempts||0)+1,correct:ok,wrong:!ok,last:Date.now()};save();state.revealed=true;render(false)}function revealOnly(){state.revealed=true;render(false)}function toggleFav(id){saved[id]={...rec({id}),fav:!rec({id}).fav};save();render(false)}function step(d){let a=filterQuestions();state.idx=Math.min(Math.max(state.idx+d,0),a.length-1);state.selection=[];state.revealed=false;render();window.scrollTo({top:180,behavior:'smooth'})}function jump(i){state.idx=i;state.selection=[];state.revealed=false;render();window.scrollTo({top:130,behavior:'smooth'})}function page(d){state.page+=d;state.idx=state.page*20;state.selection=[];state.revealed=false;render()}function resetFilter(){state.filter='all';state.search='';state.unit=0;state.idx=0;render()}function randomQuiz(){state.route='practice';state.search='';state.filter='all';let arr=filterQuestions();state.idx=Math.floor(Math.random()*arr.length);state.selection=[];state.revealed=false;render()}
function about(){return shell('關於這座複習室','原始題庫、答案、解析層次及個人學習紀錄的使用說明。')+`<div class="panel"><h2>內容與來源</h2><p>本網站以你提供的 89 頁「會計事務乙級學科題庫」及前面逐題複習內容為基礎，收錄六大工作項目共874題。題庫答案依原檔保留，複選題可選多個選項。</p><h3>我的解析如何呈現？</h3><p><strong>★ 完整重點解析：</strong>對先前已深入推算的部分題目，整合計算公式、步驟、觀念及注意事項。</p><p><strong>逐題考點解析：</strong>其餘題目依原題、題庫正解選項及考點提供重點複習方向，不冒充每一選項都有完整會計推導。若來源題庫答案可能有疑義，另加警示提示。</p><h3>資料與準確性</h3><p>題庫中的法律、準則及部分數值可能源於舊年度；本網站的考點說明不是即時法律資料庫。實際申論、執業或考試時請以現行法規及會計準則為準。題庫曾發現例如工作項目04第65、83題的答案疑義，已加註。</p><h3>你的作答資料</h3><p>答題、錯題及收藏資料只儲存在這個裝置的瀏覽器 localStorage，不會上傳伺服器。更換瀏覽器或清除網站資料可能遺失紀錄，可使用「匯出學習紀錄」備份。</p><div class="row"><button class="btn" onclick="go('practice')">前往練習</button><button class="btn alt" onclick="exportData()">備份學習紀錄</button><button class="btn danger" onclick="clearAll()">清空全部進度</button></div></div>`}
function exportData(){let blob=new Blob([JSON.stringify({version:2,exported:new Date().toISOString(),records:saved},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='會計乙級_學習紀錄.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function importData(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(typeof d.records!=='object'||!d.records||Array.isArray(d.records))throw 0;saved=d.records;save();render();alert('已匯入學習紀錄')}catch(e){alert('檔案格式不正確')}};reader.readAsText(f);e.target.value=''}function clearAll(){if(confirm('確定清空作答、錯題與收藏資料？此操作無法還原。')){saved={};save();go('dashboard')}}
function render(scroll=false){buildnav();$('#view').innerHTML=state.route==='dashboard'?dashboard():state.route==='about'?about():renderPractice()}
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(['1','2','3','4'].includes(e.key)&&state.route!=='dashboard'&&state.route!=='about')choose(+e.key-1);if(e.key==='Enter'&&state.route==='practice'&&!state.revealed)submitAnswer();if(e.key==='ArrowRight'&&['practice','mistakes','favorites'].includes(state.route))step(1);if(e.key==='ArrowLeft'&&['practice','mistakes','favorites'].includes(state.route))step(-1)});render();</script></body></html>
